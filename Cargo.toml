[package]
name = "cargo-checkup"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["wakaranakattari <wakaranakattari@gmail.com>"]
description = "Unified cargo health check: unused deps, outdated, duplicates, advisories, hygiene - one report, optional --fix"
repository = "https://github.com/wakaranakattari/cargo-checkup"
keywords = ["cargo", "audit", "dependencies", "lint", "ci"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
reqwest = { version = "0.13.5", features = ["blocking", "json", "rustls"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
toml_edit = "0.25.15"
walkdir = "2.5.0"
